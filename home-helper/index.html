<style>
:root{
  --paper:#F2F2F7;
  --card:#FFFFFF;
  --ink:#000000;
  --ink-soft:#8E8E93;
  --line:#E5E5EA;
  --p1:#007AFF;
  --p1-soft:#E5F0FF;
  --p2:#FF2D55;
  --p2-soft:#FFE8ED;
  --purple:#AF52DE;
  --indigo:#5856D6;
  --green:#34C759;
  --green-soft:#E3F8E9;
  --orange:#FF9500;
  --orange-soft:#FFF0DB;
  --red:#FF3B30;
  --red-soft:#FFE5E3;
  --fill:#E9E9EB;
  --surface:#FFFFFF;
  --seg-on:#FFFFFF;
  --ctrl-line:#C7C7CC;
  --pa-a:#F5E6FC;
  --nav-bg:rgba(249,249,251,.82);
  --toast-bg:rgba(0,0,0,.84);
  --toast-ink:#FFFFFF;
  --green-ink:#1F8F3E;
  --orange-ink:#B26200;
  --p2-ink:#C71E40;
  --lift:0 1px 2px rgba(0,0,0,.04);
  --radius:16px;
  --display:-apple-system,'SF Pro Display',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --body:-apple-system,'SF Pro Text',BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --paper:#000000;
  --card:#1C1C1E;
  --surface:#1C1C1E;
  --seg-on:#48484A;
  --ink:#FFFFFF;
  --ink-soft:#98989F;
  --line:#38383A;
  --fill:#2C2C2E;
  --ctrl-line:#5A5A5E;
  --p1:#0A84FF;
  --p1-soft:rgba(10,132,255,.22);
  --p2:#FF375F;
  --p2-soft:rgba(255,55,95,.22);
  --p2-ink:#FF6482;
  --purple:#BF5AF2;
  --indigo:#5E5CE6;
  --green:#30D158;
  --green-soft:rgba(48,209,88,.20);
  --green-ink:#30D158;
  --orange:#FF9F0A;
  --orange-soft:rgba(255,159,10,.20);
  --orange-ink:#FFB340;
  --red:#FF453A;
  --red-soft:rgba(255,69,58,.20);
  --pa-a:rgba(191,90,242,.24);
  --nav-bg:rgba(22,22,24,.80);
  --toast-bg:rgba(240,240,245,.94);
  --toast-ink:#000000;
  --lift:none;
  }
}
:root[data-theme="dark"]{
  --paper:#000000;
  --card:#1C1C1E;
  --surface:#1C1C1E;
  --seg-on:#48484A;
  --ink:#FFFFFF;
  --ink-soft:#98989F;
  --line:#38383A;
  --fill:#2C2C2E;
  --ctrl-line:#5A5A5E;
  --p1:#0A84FF;
  --p1-soft:rgba(10,132,255,.22);
  --p2:#FF375F;
  --p2-soft:rgba(255,55,95,.22);
  --p2-ink:#FF6482;
  --purple:#BF5AF2;
  --indigo:#5E5CE6;
  --green:#30D158;
  --green-soft:rgba(48,209,88,.20);
  --green-ink:#30D158;
  --orange:#FF9F0A;
  --orange-soft:rgba(255,159,10,.20);
  --orange-ink:#FFB340;
  --red:#FF453A;
  --red-soft:rgba(255,69,58,.20);
  --pa-a:rgba(191,90,242,.24);
  --nav-bg:rgba(22,22,24,.80);
  --toast-bg:rgba(240,240,245,.94);
  --toast-ink:#000000;
  --lift:none;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
  position:relative;
  /* Soft ambient field so pages aren't a flat slab of grey */
  background-image:
    radial-gradient(ellipse 90% 55% at 12% -5%, rgba(0,122,255,.11), transparent 55%),
    radial-gradient(ellipse 70% 45% at 92% 8%, rgba(255,45,85,.08), transparent 50%),
    radial-gradient(ellipse 60% 40% at 70% 95%, rgba(175,82,222,.07), transparent 55%),
    radial-gradient(ellipse 50% 30% at 20% 85%, rgba(88,86,214,.06), transparent 50%),
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 18%, transparent 82%, rgba(0,0,0,.03) 100%);
  background-attachment:fixed;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body{
    background-image:
      radial-gradient(ellipse 90% 55% at 10% -8%, rgba(10,132,255,.18), transparent 55%),
      radial-gradient(ellipse 70% 45% at 95% 5%, rgba(255,55,95,.12), transparent 50%),
      radial-gradient(ellipse 55% 40% at 75% 100%, rgba(191,90,242,.1), transparent 55%),
      radial-gradient(ellipse 50% 30% at 15% 90%, rgba(94,92,230,.08), transparent 50%),
      linear-gradient(180deg, rgba(255,255,255,.04) 0%, transparent 20%, transparent 80%, rgba(0,0,0,.35) 100%);
  }
}
:root[data-theme="dark"] body{
  background-image:
    radial-gradient(ellipse 90% 55% at 10% -8%, rgba(10,132,255,.18), transparent 55%),
    radial-gradient(ellipse 70% 45% at 95% 5%, rgba(255,55,95,.12), transparent 50%),
    radial-gradient(ellipse 55% 40% at 75% 100%, rgba(191,90,242,.1), transparent 55%),
    radial-gradient(ellipse 50% 30% at 15% 90%, rgba(94,92,230,.08), transparent 50%),
    linear-gradient(180deg, rgba(255,255,255,.04) 0%, transparent 20%, transparent 80%, rgba(0,0,0,.35) 100%);
}
:root[data-theme="light"] body{
  background-image:
    radial-gradient(ellipse 90% 55% at 12% -5%, rgba(0,122,255,.11), transparent 55%),
    radial-gradient(ellipse 70% 45% at 92% 8%, rgba(255,45,85,.08), transparent 50%),
    radial-gradient(ellipse 60% 40% at 70% 95%, rgba(175,82,222,.07), transparent 55%),
    radial-gradient(ellipse 50% 30% at 20% 85%, rgba(88,86,214,.06), transparent 50%),
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 18%, transparent 82%, rgba(0,0,0,.03) 100%);
}
button{font-family:var(--body);border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:var(--body);font-size:16px;color:var(--ink)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-0.022em}

/* ---------- header ---------- */
header{
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:baseline;justify-content:space-between;
  position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.45) 0%, transparent 100%);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) header{
    background:linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 100%);
  }
}
:root[data-theme="dark"] header{
  background:linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 100%);
}
:root[data-theme="light"] header{
  background:linear-gradient(180deg, rgba(255,255,255,.45) 0%, transparent 100%);
}
.brand{display:flex;align-items:center;gap:11px}
header h1{font-size:23px;line-height:1.05}
header h1 em{font-style:normal;background:linear-gradient(120deg,#FF2D55,#AF52DE);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header h1 span{display:block;font-family:var(--body);font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-top:2px}
.avatars{display:flex;flex:none}
.pa{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;
  border:2px solid var(--paper);display:block}
.pa svg{width:100%;height:100%;display:block}
.pa.k{background:var(--p1-soft)}
.pa.a{background:var(--pa-a)}
.avatars .pa+.pa{margin-left:-13px}
.name-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.name-row .pa{width:44px;height:44px;border-width:0}
.name-row .field{flex:1;margin-bottom:0}
#syncDot{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}
#syncDot::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
#syncDot.saving::before{background:var(--orange)}
#syncDot.error::before{background:var(--red)}

.page{display:none;padding:4px 16px 24px;opacity:0;transform:translateY(6px)}
.page.active{
  display:block;
  animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
@media (prefers-reduced-motion:reduce){
  .page.active{animation:none;opacity:1;transform:none}
}

/* ---------- today strip ---------- */
.today-strip{
  background:
    linear-gradient(160deg, rgba(255,255,255,.28) 0%, transparent 42%),
    linear-gradient(135deg,#007AFF 0%,#5856D6 55%,#AF52DE 100%);
  color:#fff;border-radius:20px;padding:16px 18px;margin-bottom:14px;
  box-shadow:
    0 8px 22px -10px rgba(88,86,214,.55),
    0 1px 0 rgba(255,255,255,.25) inset,
    0 -1px 0 rgba(0,0,0,.08) inset;
  position:relative;overflow:hidden;
}
.today-strip::after{
  content:'';position:absolute;top:-40%;right:-15%;width:55%;height:90%;
  background:radial-gradient(circle, rgba(255,255,255,.22) 0%, transparent 70%);
  pointer-events:none;
}
.today-strip .date{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-0.024em;position:relative;z-index:1}
.today-strip .sub{font-size:13.5px;opacity:.9;margin-top:3px;font-weight:500;position:relative;z-index:1}

/* ---------- cards & lists ---------- */
.card{
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 28%),
    var(--card);
  border-radius:var(--radius);padding:6px 14px;margin-bottom:12px;
  box-shadow:
    var(--lift),
    0 1px 0 rgba(255,255,255,.6) inset,
    0 8px 20px -12px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card{
    background:
      linear-gradient(180deg, rgba(255,255,255,.06) 0%, transparent 32%),
      var(--card);
    box-shadow:
      0 1px 0 rgba(255,255,255,.06) inset,
      0 8px 24px -10px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"] .card{
  background:
    linear-gradient(180deg, rgba(255,255,255,.06) 0%, transparent 32%),
    var(--card);
  box-shadow:
    0 1px 0 rgba(255,255,255,.06) inset,
    0 8px 24px -10px rgba(0,0,0,.45);
}
:root[data-theme="light"] .card{
  background:
    linear-gradient(180deg, rgba(255,255,255,.55) 0%, transparent 28%),
    var(--card);
  box-shadow:
    var(--lift),
    0 1px 0 rgba(255,255,255,.6) inset,
    0 8px 20px -12px rgba(0,0,0,.08);
}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}
.section-title h2{font-size:19px}
.section-title .hint{font-size:12px;color:var(--ink-soft)}

.row{
  display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);
  transition:background .18s ease, opacity .22s ease, transform .22s cubic-bezier(.2,.8,.2,1);
}
.row:last-child{border-bottom:none}
.row:active{background:var(--fill);border-radius:10px}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s, text-decoration-color .2s}
.row .meta{font-size:12.5px;color:var(--ink-soft)}
.row.done .title{text-decoration:line-through;color:var(--ink-soft);font-weight:400}
.row.done{opacity:.72}

.check{
  width:25px;height:25px;border-radius:50%;border:1.8px solid var(--ctrl-line);flex:none;
  display:flex;align-items:center;justify-content:center;background:var(--surface);
  transition:background .22s cubic-bezier(.2,.8,.2,1), border-color .22s cubic-bezier(.2,.8,.2,1),
              transform .22s cubic-bezier(.34,1.56,.64,1), color .15s;
}
.check.on{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.08)}
.check svg{width:14px;height:14px;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.check.on svg{transform:scale(1.05)}

.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.p0{background:var(--p1)}
.dot.p1{background:var(--p2)}
.dot.both{background:linear-gradient(90deg,var(--p1) 50%,var(--p2) 50%)}

.tag{font-size:11.5px;padding:2px 8px;border-radius:99px;font-weight:600}
.tag.p0{background:var(--p1-soft);color:var(--p1)}
.tag.p1{background:var(--p2-soft);color:var(--p2-ink)}
.tag.both{background:var(--fill);color:var(--ink-soft)}
.tag.paid{background:var(--green-soft);color:var(--green-ink)}
.tag.due{background:var(--red-soft);color:var(--red)}
.tag.soon{background:var(--orange-soft);color:var(--orange-ink)}

.icon-btn{color:var(--ctrl-line);padding:6px;flex:none}
.icon-btn svg{width:17px;height:17px;display:block}

/* ---------- add bar ---------- */
.addbar{display:flex;gap:8px;margin-bottom:6px}
.addbar input{
  flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface);outline:none;
}
.addbar input:focus{border-color:var(--p1)}
.btn{
  background:
    linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 55%),
    var(--p1);
  color:#fff;border-radius:12px;padding:11px 16px;font-weight:600;flex:none;
  letter-spacing:-0.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 4px 12px -4px rgba(0,122,255,.4);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), opacity .18s, background .18s, box-shadow .18s;
}
.btn.gold{
  background:linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 55%), var(--p2);
  box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 4px 12px -4px rgba(255,45,85,.4);
}
.btn.ghost{font-weight:600}
.btn.ghost{background:transparent;color:var(--p1);border:1.5px solid var(--p1);box-shadow:none}
.btn.small{padding:8px 13px;font-size:13.5px;border-radius:10px}
.btn:active{transform:scale(.96);opacity:.88}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.cal-head h2{font-size:20px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{
  width:34px;height:34px;border-radius:10px;background:var(--surface);border:none;font-size:17px;color:var(--p1);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 1px 3px rgba(0,0,0,.06);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;padding:4px 0;text-transform:uppercase}
.day{
  aspect-ratio:1/1.05;border-radius:11px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.5) 0%, transparent 40%),
    var(--surface);
  border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:13.5px;position:relative;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
  transition:background .2s, box-shadow .2s, transform .18s cubic-bezier(.2,.8,.2,1);
}
.day.out{opacity:.35;background:transparent;border-color:transparent;box-shadow:none}
.day.today{border:1.5px solid var(--p1);font-weight:700;color:var(--p1);
  box-shadow:0 0 0 3px rgba(0,122,255,.12), 0 1px 0 rgba(255,255,255,.4) inset}
.card,.stat{border:1px solid transparent}

/* ---------- splash / open loading ---------- */
#splash{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;
  background:var(--paper);
  overflow:hidden;
  transition:opacity .55s cubic-bezier(.2,.8,.2,1), visibility .55s;
}
#splash.done{
  opacity:0;visibility:hidden;pointer-events:none;
}
/* Ambient light layers — soft coloured washes so it isn't a flat slab */
.splash-glow{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(48px);opacity:.55;
  will-change:transform, opacity;
}
.splash-glow-a{
  width:280px;height:280px;top:8%;left:50%;margin-left:-140px;
  background:radial-gradient(circle, rgba(0,122,255,.45) 0%, rgba(0,122,255,0) 70%);
  animation:glowDriftA 7s ease-in-out infinite alternate;
}
.splash-glow-b{
  width:240px;height:240px;bottom:12%;right:-40px;
  background:radial-gradient(circle, rgba(255,45,85,.38) 0%, rgba(255,45,85,0) 70%);
  animation:glowDriftB 8.5s ease-in-out infinite alternate;
}
.splash-glow-c{
  width:200px;height:200px;bottom:28%;left:-30px;
  background:radial-gradient(circle, rgba(175,82,222,.32) 0%, rgba(175,82,222,0) 70%);
  animation:glowDriftC 6.5s ease-in-out infinite alternate;
}
.splash-vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 50% 42%, transparent 0%, transparent 45%, rgba(0,0,0,.06) 100%),

  :root:not([data-theme="light"]) .splash-glow-a{background:radial-gradient(circle, rgba(10,132,255,.5) 0%, transparent 70%);opacity:.7}
  :root:not([data-theme="light"]) .splash-glow-b{background:radial-gradient(circle, rgba(255,55,95,.42) 0%, transparent 70%);opacity:.65}
  :root:not([data-theme="light"]) .splash-glow-c{background:radial-gradient(circle, rgba(191,90,242,.36) 0%, transparent 70%);opacity:.6}
  :root:not([data-theme="light"]) .splash-vignette{
    background:
      radial-gradient(ellipse 80% 60% at 50% 42%, transparent 0%, transparent 40%, rgba(0,0,0,.45) 100%),
      linear-gradient(180deg, rgba(255,255,255,.04) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.25) 100%);
  }
}
:root[data-theme="dark"] .splash-glow-a{background:radial-gradient(circle, rgba(10,132,255,.5) 0%, transparent 70%);opacity:.7}
:root[data-theme="dark"] .splash-glow-b{background:radial-gradient(circle, rgba(255,55,95,.42) 0%, transparent 70%);opacity:.65}
:root[data-theme="dark"] .splash-glow-c{background:radial-gradient(circle, rgba(191,90,242,.36) 0%, transparent 70%);opacity:.6}

    radial-gradient(ellipse 80% 60% at 50% 42%, transparent 0%, transparent 40%, rgba(0,0,0,.45) 100%),

}
@keyframes glowDriftA{
  from{transform:translate(-18px,-10px) scale(1)}
  to{transform:translate(22px,16px) scale(1.12)}
}
@keyframes glowDriftB{
  from{transform:translate(10px,8px) scale(1)}
  to{transform:translate(-20px,-14px) scale(1.15)}
}
@keyframes glowDriftC{
  from{transform:translate(6px,-12px) scale(1.05)}
  to{transform:translate(18px,20px) scale(.92)}
}
.splash-inner{
  position:relative;z-index:2;text-align:center;
  animation:splashRise .7s cubic-bezier(.2,.85,.2,1) both;
}
@keyframes splashRise{
  from{opacity:0;transform:translateY(18px) scale(.94)}

}
.splash-avatars{
  display:flex;justify-content:center;margin-bottom:22px;

}

  width:72px;height:72px;border-width:3px;

}

@keyframes avatarFloat{

}
.splash-mark{
  width:64px;height:64px;margin:0 auto 18px;border-radius:18px;

}
@keyframes markPulse{
  0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.18) inset, 0 12px 40px rgba(0,122,255,.35), 0 4px 12px rgba(255,45,85,.2)}

}

}
.splash-bar{
  width:48px;height:3px;margin:0 auto;border-radius:99px;
  background:var(--fill);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.splash-bar i{
  display:block;height:100%;width:40%;border-radius:99px;
  background:linear-gradient(90deg, var(--p1), var(--p2));
  animation:barSlide 1.1s cubic-bezier(.4,0,.2,1) infinite;
  box-shadow:0 0 8px rgba(0,122,255,.45);
}
@keyframes barSlide{
  0%{transform:translateX(-120%)}

}

}

  <div class="splash-glow splash-glow-a"></div>

/* =================== sounds =================== */
/* Web-Audio UI sounds — no assets, works offline. Fail silently if
   AudioContext is blocked (e.g. before a user gesture on some browsers). */
let _ac = null;
function _ctx(){
  if(!_ac){
    try{ _ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(_ac.state === 'suspended') _ac.resume().catch(()=>{});
  return _ac;
}
function _tone(c, freq, type, t0, dur, vol, slideTo){
  const o = c.createOscillator();
  const g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur * 0.85);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function play(kind){
  const c = _ctx(); if(!c) return;
  const t = c.currentTime;
  switch(kind){
    case 'key':
      _tone(c, 920, 'sine', t, 0.055, 0.07);
      _tone(c, 1380, 'sine', t, 0.04, 0.035);
      break;
    case 'tick':
      _tone(c, 1100, 'sine', t, 0.06, 0.09);
      _tone(c, 1650, 'sine', t + 0.02, 0.05, 0.05);
      break;
    case 'untick':
      _tone(c, 700, 'sine', t, 0.06, 0.07, 480);
      break;
    case 'del':
      _tone(c, 340, 'triangle', t, 0.11, 0.09, 180);
      _tone(c, 220, 'sine', t + 0.02, 0.09, 0.05);
      break;
    case 'add':
      _tone(c, 640, 'sine', t, 0.07, 0.07);
      _tone(c, 960, 'sine', t + 0.045, 0.08, 0.08);
      break;
    case 'paid':
      _tone(c, 740, 'sine', t, 0.12, 0.09);
      _tone(c, 990, 'sine', t + 0.08, 0.14, 0.1);
      _tone(c, 1320, 'sine', t + 0.16, 0.16, 0.08);
      break;
    case 'unlock':
      _tone(c, 520, 'sine', t, 0.12, 0.08);
      _tone(c, 780, 'sine', t + 0.07, 0.13, 0.09);
      _tone(c, 1040, 'sine', t + 0.14, 0.18, 0.1);
      _tone(c, 1560, 'sine', t + 0.22, 0.2, 0.06);
      break;
    case 'lock':
      _tone(c, 880, 'sine', t, 0.1, 0.07, 440);
      _tone(c, 520, 'triangle', t + 0.06, 0.14, 0.06);
      break;
    case 'nav':
      _tone(c, 680, 'sine', t, 0.045, 0.05);
      break;
    case 'sheet':
      _tone(c, 400, 'sine', t, 0.08, 0.04, 560);
      break;
    case 'sheetClose':
      _tone(c, 520, 'sine', t, 0.07, 0.035, 300);
      break;
    case 'remote':
      _tone(c, 480, 'sine', t, 0.1, 0.05);
      _tone(c, 720, 'sine', t + 0.06, 0.12, 0.05);
      break;
    case 'error':
      _tone(c, 260, 'triangle', t, 0.1, 0.1);
      _tone(c, 200, 'triangle', t + 0.09, 0.14, 0.09);
      break;
    case 'whoosh':
      _tone(c, 900, 'sine', t, 0.12, 0.03, 200);
      break;
    default:
      _tone(c, 800, 'sine', t, 0.06, 0.07);
  }
}

let KEY = null;

async function encrypt(txt){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, KEY, new TextEncoder().encode(txt));
  return b64(iv) + ':' + b64(new Uint8Array(ct));
}
async function decrypt(blob){
  const bits = String(blob).split(':');
  if(bits.length !== 2) throw new Error('not encrypted');
  return new TextDecoder().decode(await crypto.subtle.decrypt(
    {name:'AES-GCM', iv: unb64(bits[0])}, KEY, unb64(bits[1])));
}

const store = {
  async get(k){
    let raw;
    if(CLOUD){
      const { data, error } = await sb.from('homehub_data')
        .select('value').eq('household', HOUSEHOLD).eq('key', k).maybeSingle();
      if(error) throw error;
      raw = data && data.value;
    }
    else raw = localStorage.getItem(k);
    if(raw === null || raw === undefined) return null;
    return {key:k, value: await decrypt(raw)};
  },
  async set(k,v){
    const blob = await encrypt(v);
    if(CLOUD){
      const { error } = await sb.from('homehub_data')
        .upsert({household:HOUSEHOLD, key:k, value:blob, updated_at:new Date().toISOString()},
                {onConflict:'household,key'});
      if(error) throw error;
      return {key:k, value:v};
    }
    localStorage.setItem(k, blob);
    return {key:k, value:v};
  }
};

/* ---------- live sync ---------- */
const remoteRaw = {};
let pulseTs = 0, polling = false;

async function loadAll(){
  setSync('saving','loading…');
  for(const k of KEYS){
    try{
      const r = await store.get('homehub:'+k);
      if(r && r.value){ S[k] = JSON.parse(r.value); remoteRaw[k] = r.value; }
    }catch(e){ /* key doesn't exist yet — first run */ }
  }
  try{
    const r = await store.get('homehub:pulse');
    if(r && r.value) pulseTs = JSON.parse(r.value).ts || 0;
  }catch(e){}
  setSync('', RESTING);
  renderAll();
}

async function pollRemote(){
  if(!CLOUD || polling || document.hidden) return;
  polling = true;
  try{
    const r = await store.get('homehub:pulse');
    const pulse = r && r.value ? JSON.parse(r.value) : null;
    if(pulse && pulse.ts !== pulseTs){
      pulseTs = pulse.ts;
      let changed = false;
      for(const k of KEYS){
        try{
          const g = await store.get('homehub:'+k);
          if(g && g.value !== remoteRaw[k]){
            remoteRaw[k] = g.value;
            S[k] = JSON.parse(g.value);
            changed = true;
          }
        }catch(e){}
      }
      if(changed){
        renderAll();
        if(pulse.by !== ME){
          play('remote');
          toast((S.people[pulse.by] || 'Someone') + ' just changed something');
        }
      }
    }
    setSync('', RESTING);
  }catch(e){
    console.error('pollRemote failed:', e);
    setSync('error', 'sync error: ' + (e.message || e.code || 'unknown'));
  }
  polling = false;
}
const saveTimers = {};
function save(key){
  setSync('saving','saving…');
  clearTimeout(saveTimers[key]);
  saveTimers[key] = setTimeout(async ()=>{
    try{
      const raw = JSON.stringify(S[key]);
      await store.set('homehub:'+key, raw);
      remoteRaw[key] = raw;
      if(CLOUD){
        pulseTs = Date.now();
        await store.set('homehub:pulse', JSON.stringify({by:ME, ts:pulseTs}));
      }
      setSync('', RESTING);
    }catch(e){ setSync('error','offline — retrying'); setTimeout(()=>save(key),4000); }
  },350);
}

/* =================== lock =================== */
/* There is no stored PIN and no "is it correct" branch to skip past. The PIN
   derives an AES key; VERIFIER is a known phrase encrypted with the right key.
   If it decrypts, the PIN was right — and that same key is what reads your
   data. Get it wrong and everything on disk stays unreadable. */
const SALT     = '07wWziJqsaA91LstMVvHpQ==';
const IV       = 'o8DT7k0IX7Bak+Vp';
const VERIFIER = 'RwgZ85QCH6/LvKUIHIZAAlvaxMMvKT/ytKdPy18XzjQPeRCz';
const TOKEN    = 'KandA-Home-Helper-v1';
const ITERS    = 600000;
const PIN_LEN  = 6;
let entered = '';

const b64   = bytes => btoa(String.fromCharCode(...bytes));
const unb64 = str   => Uint8Array.from(atob(str), c=>c.charCodeAt(0));

async function deriveKey(pin){
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:unb64(SALT), iterations:ITERS, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}

function drawPins(){
  document.getElementById('pins').innerHTML =
    Array.from({length:PIN_LEN}, (_,i)=>'<i class="'+(i<entered.length?'on':'')+'"></i>').join('');
}
function buildKeypad(){
  const keys = ['1','2','3','4','5','6','7','8','9','','0','del'];
  document.getElementById('keypad').innerHTML = keys.map(k=>{
    if(k === '') return '<button class="blank" tabindex="-1"></button>';
    if(k === 'del') return '<button class="act" onclick="pinDel()" aria-label="Delete">Delete</button>';
    return '<button onclick="pinTap(\''+k+'\')">'+k+'</button>';
  }).join('');
  document.getElementById('lockAvatars').innerHTML = avatar(0)+avatar(1);
  drawPins();
}
function pinTap(d){
  if(entered.length >= PIN_LEN || document.getElementById('lock').classList.contains('busy')) return;
  entered += d; drawPins(); play('key');
  if(entered.length === PIN_LEN) setTimeout(checkPin, 120);
}
function pinDel(){ entered = entered.slice(0,-1); drawPins(); play('untick'); }

function pinFail(msg){
  const pins = document.getElementById('pins'), m = document.getElementById('lockMsg');
  pins.classList.add('shake');
  m.textContent = msg; m.classList.add('bad');
  play('error');
  if(navigator.vibrate) navigator.vibrate([50,30,50,30,40]);
  setTimeout(()=>{
    pins.classList.remove('shake'); entered=''; drawPins();
    m.textContent = 'Enter your PIN'; m.classList.remove('bad');
  }, 720);
}

async function checkPin(){
  const lock = document.getElementById('lock'), msg = document.getElementById('lockMsg');
  if(!(window.crypto && crypto.subtle)){
    pinFail('Needs a secure (https) connection'); return;
  }
  lock.classList.add('busy');
  msg.textContent = 'Unlocking…';
  try{
    const key = await deriveKey(entered);
    const out = await crypto.subtle.decrypt(
      {name:'AES-GCM', iv:unb64(IV)}, key, unb64(VERIFIER));
    if(new TextDecoder().decode(out) !== TOKEN) throw new Error('bad');
    KEY = key;
    lock.classList.remove('busy');
    unlock(true);
    await loadAll();
    startSync();
    startRealtime();
  }catch(e){
    lock.classList.remove('busy');
    pinFail('Wrong PIN — try again');
  }
}
function unlock(withSound){
  const lock = document.getElementById('lock');
  if(withSound) play('unlock');
  lock.classList.add('out');
  setTimeout(()=>{
    lock.classList.add('hide');
    lock.classList.remove('out');
  }, 360);
  entered=''; drawPins();
}
function lockNow(){
  KEY = null;
  entered=''; drawPins();
  document.getElementById('lockMsg').textContent = 'Enter your PIN';
  const lock = document.getElementById('lock');
  lock.classList.remove('hide','out');
  play('lock');
  closeSheet();
  location.reload();
}

const overlay = document.getElementById('overlay');

let _sheetClosing = false;
function openSheet(html){
  if(_sheetClosing) return;
  sheet.innerHTML = html;
  overlay.classList.remove('closing');
  // force reflow so the open transition always runs
  void overlay.offsetWidth;
  overlay.classList.add('open');
  play('sheet');
}
function closeSheet(){
  if(!overlay.classList.contains('open') || _sheetClosing){
    overlay.classList.remove('open','closing');
    sheet.innerHTML = '';
    return;
  }
  _sheetClosing = true;
  overlay.classList.add('closing');
  play('sheetClose');
  setTimeout(()=>{
    overlay.classList.remove('open','closing');
    sheet.innerHTML = '';
    _sheetClosing = false;
  }, 380);
}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function renderToday(){
  const now = new Date();
  document.getElementById('todayDate').textContent =
    now.toLocaleDateString('en-AU',{weekday:'long', day:'numeric', month:'long'});
  const todays = S.events.filter(e=>e.date===isoDate(now));
  const bills = billsDueSoon();
  let sub = todays.length ? (todays.length+' event'+(todays.length>1?'s':'')+' today') : 'Nothing on today';
  if(bills.length) sub += ' · '+bills.length+' bill'+(bills.length>1?'s':'')+' due this week';
  const ch = choresDueNow().length;
  if(ch) sub += ' · '+ch+' chore'+(ch>1?'s':'')+' to do';
  document.getElementById('todaySub').textContent = sub;
}

function calShift(n){
  calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth()+n, 1);
  renderCal();
}

function renderCal(){
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  document.getElementById('calMonth').textContent = MONTHS[m]+' '+y;
  const first = new Date(y,m,1);
  const startOffset = (first.getDay()+6)%7;   // Monday-first
  const daysIn = new Date(y,m+1,0).getDate();
  const todayIso = isoDate(new Date());
  let html = DOWS.map(d=>'<div class="dow">'+d+'</div>').join('');
  for(let i=0;i<startOffset;i++) html += '<div class="day out"></div>';
  for(let d=1; d<=daysIn; d++){
    const iso = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const evs = S.events.filter(e=>e.date===iso);
    const cls = ['day', iso===todayIso?'today':'', iso===selDate?'sel':''].join(' ');
    const dots = evs.slice(0,3).map(e=>{
      const col = e.person===2 ? 'background:linear-gradient(90deg,var(--p1) 50%,var(--p2) 50%)'
                : e.person===1 ? 'background:var(--p2)' : 'background:var(--p1)';
      return '<span style="'+col+'"></span>';
    }).join('');
    html += '<button class="'+cls+'" onclick="pickDay(\''+iso+'\')">'+d+'<span class="dots">'+dots+'</span></button>';
  }
  document.getElementById('calGrid').innerHTML = html;
  renderDayEvents();
}

function pickDay(iso){
  selDate = iso;
  renderCal();
}

function renderDayEvents(){
  const d = new Date(selDate+'T00:00');
  document.getElementById('dayTitle').textContent =
    d.toLocaleDateString('en-AU',{weekday:'long', day:'numeric', month:'short'});
  const evs = S.events.filter(e=>e.date===selDate).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);

      '<span class="dot '+(e.person===2?'both':'p'+e.person)+'"></span>'+
      '<div class="grow"><div class="title">'+esc(e.title)+'</div>'+
      '<div class="meta">'+(e.time?fmtTime(e.time)+' · ':'')+esc(e.person===2?'Both':S.people[e.person]||'')+(e.notes?' · '+esc(e.notes):'')+'</div></div>'+
      '<button class="icon-btn" style="color:var(--p1)" onclick="downloadIcs(\''+e.id+'\')" aria-label="Add to iPhone Calendar">'+CALPLUS_SVG+'</button>'+
      '<button class="icon-btn" onclick="delEvent(\''+e.id+'\')" aria-label="Delete">'+TRASH_SVG+'</button>'+

function fmtTime(t){
  const [h,m]=t.split(':').map(Number);
  const ap = h>=12?'pm':'am';
  return ((h%12)||12)+(m?':'+String(m).padStart(2,'0'):'')+ap;
}

/* ---------- .ics export ---------- */
function icsStamp(date, time){
  const d = date.replace(/-/g,'');
  return time ? d+'T'+time.replace(':','')+'00' : d;
}
function eventToVevent(e){
  const hasTime = !!e.time;
  let start, end;
  if(hasTime){
    start = 'DTSTART:'+icsStamp(e.date,e.time);
    const [h,m]=e.time.split(':').map(Number);
    const endD = new Date(e.date+'T00:00'); endD.setHours(h+1,m);
    end = 'DTEND:'+icsStamp(isoDate(endD), String(endD.getHours()).padStart(2,'0')+':'+String(endD.getMinutes()).padStart(2,'0'));
  }else{
    start = 'DTSTART;VALUE=DATE:'+icsStamp(e.date);
    const nd = new Date(e.date+'T00:00'); nd.setDate(nd.getDate()+1);
    end = 'DTEND;VALUE=DATE:'+icsStamp(isoDate(nd));
  }
  return ['BEGIN:VEVENT','UID:'+e.id+'@homehub',
    'DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    start, end,
    'SUMMARY:'+e.title.replace(/([,;])/g,'\\$1'),
    e.notes?'DESCRIPTION:'+e.notes.replace(/([,;])/g,'\\$1'):'',
    'END:VEVENT'].filter(Boolean).join('\r\n');
}
function makeIcs(events){
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//HomeHub//EN','CALSCALE:GREGORIAN',
    ...events.map(eventToVevent),'END:VCALENDAR'].join('\r\n');
}
function downloadIcsFile(text, name){
  const blob = new Blob([text], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function downloadIcs(id){
  const e = S.events.find(x=>x.id===id);
  if(e) downloadIcsFile(makeIcs([e]), e.title.replace(/\W+/g,'-').toLowerCase()+'.ics');
}
function exportAllIcs(){
  const y=calCursor.getFullYear(), m=calCursor.getMonth();
  const evs = S.events.filter(e=>{ const d=new Date(e.date+'T00:00'); return d.getFullYear()===y && d.getMonth()===m; });
  if(!evs.length){ alert('No events in '+MONTHS[m]+' yet.'); return; }
  downloadIcsFile(makeIcs(evs), 'homehub-'+MONTHS[m].toLowerCase()+'.ics');
}

/* =================== bills =================== */
function monthKey(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); }
function billDueDate(b){
  const n = new Date();
  const daysIn = new Date(n.getFullYear(), n.getMonth()+1, 0).getDate();
  return new Date(n.getFullYear(), n.getMonth(), Math.min(b.day, daysIn));
}
function billPaidThisMonth(b){ return b.paid === monthKey(); }
function billsDueSoon(){
  const now = new Date(); now.setHours(0,0,0,0);
  const week = new Date(now); week.setDate(week.getDate()+7);
  return S.bills.filter(b=>{ const d=billDueDate(b); return !billPaidThisMonth(b) && d>=now && d<=week; });
}

  );
}
function saveBill(editId){
  const name = document.getElementById('blName').value.trim();
  const amount = parseFloat(document.getElementById('blAmt').value);
  const day = Math.min(31, Math.max(1, parseInt(document.getElementById('blDay').value)||1));
  if(!name || isNaN(amount)) return;
  if(editId){
    const b = S.bills.find(x=>x.id===editId);
    Object.assign(b,{name,amount,day,person:segVal('blPerson')});
  }else{
    S.bills.push({id:uid(), name, amount, day, person:segVal('blPerson'), paid:''});
  }
  play('add'); save('bills'); closeSheet(); renderBills(); renderToday();
}
function delBill(id){
  S.bills = S.bills.filter(b=>b.id!==id);
  play('del'); save('bills'); closeSheet(); renderBills(); renderToday();
}
function togglePaid(id){
  const b = S.bills.find(x=>x.id===id);
  if(b){ const now = !billPaidThisMonth(b); b.paid = now ? monthKey() : '';
         play(now?'paid':'untick'); save('bills'); renderBills(); renderToday(); }
}
function renderBills(){
  const now = new Date();
  document.getElementById('billMonthLbl').textContent = MONTHS[now.getMonth()];
  const total = S.bills.reduce((s,b)=>s+b.amount,0);
  const paid = S.bills.filter(billPaidThisMonth).reduce((s,b)=>s+b.amount,0);
  document.getElementById('billTotal').textContent = money(total);
  document.getElementById('billPaid').textContent = money(paid);
  document.getElementById('billLeft').textContent = money(total-paid);
  document.getElementById('billBar').style.width = total ? (paid/total*100)+'%' : '0%';

  const list = document.getElementById('billList');
  if(!S.bills.length){
    list.innerHTML = '<div class="empty"><b>No bills yet</b>Add your rent, power, internet, subs — anything with a due date.</div>';
    return;
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const sorted = [...S.bills].sort((a,b)=>billPaidThisMonth(a)-billPaidThisMonth(b) || a.day-b.day);
  list.innerHTML = sorted.map(b=>{
    const isPaid = billPaidThisMonth(b);
    const due = billDueDate(b);
    const daysAway = Math.round((due-today)/86400000);
    let status;
    if(isPaid) status = '<span class="tag paid">Paid</span>';
    else if(daysAway<0) status = '<span class="tag due">Overdue</span>';
    else if(daysAway<=5) status = '<span class="tag soon">'+(daysAway===0?'Due today':'Due in '+daysAway+'d')+'</span>';
    else status = '<span class="tag both">Due '+due.getDate()+getOrd(due.getDate())+'</span>';
    return '<div class="row'+(isPaid?' done':'')+'">'+
      '<button class="check'+(isPaid?' on':'')+'" onclick="togglePaid(\''+b.id+'\')" aria-label="Mark paid">'+(isPaid?CHECK_SVG:'')+'</button>'+
      '<div class="grow" onclick="openBillSheet(\''+b.id+'\')">'+
        '<div class="title">'+esc(b.name)+' · '+money(b.amount)+'</div>'+
        '<div class="meta">'+esc(b.person===2?'Both':S.people[b.person]||'')+' · every month on the '+b.day+getOrd(b.day)+'</div>'+
      '</div>'+status+
    '</div>';
  }).join('');
}
function getOrd(n){ const s=['th','st','nd','rd'], v=n%100; return s[(v-20)%10]||s[v]||s[0]; }

/* =================== tasks & notes =================== */
function addTask(){
  const inp = document.getElementById('taskInput');
  const v = inp.value.trim();
  if(!v) return;
  S.tasks.push({id:uid(), name:v, done:false});
  inp.value=''; inp.focus(); play('add');
  save('tasks'); renderTasks();
}
function toggleTask(id){
  const t = S.tasks.find(x=>x.id===id);
  if(t){ t.done=!t.done; play(t.done?'tick':'untick'); save('tasks'); renderTasks(); }
}
function delTask(id){
  S.tasks = S.tasks.filter(x=>x.id!==id);
  play('del'); save('tasks'); renderTasks();
}
function renderTasks(){
  const left = S.tasks.filter(t=>!t.done).length;
  document.getElementById('taskCount').textContent = S.tasks.length ? left+' open' : '';
  const list = document.getElementById('taskList');
  if(!S.tasks.length){
    list.innerHTML = '<div class="empty"><b>All clear</b>Chores, errands, life admin — chuck it all in here.</div>';
    return;
  }
  const sorted=[...S.tasks].sort((a,b)=>a.done-b.done);
  list.innerHTML = sorted.map(t=>
    '<div class="row'+(t.done?' done':'')+'">'+
      '<button class="check'+(t.done?' on':'')+'" onclick="toggleTask(\''+t.id+'\')" aria-label="Done">'+(t.done?CHECK_SVG:'')+'</button>'+
      '<div class="grow"><div class="title">'+esc(t.name)+'</div></div>'+
      '<button class="icon-btn" onclick="delTask(\''+t.id+'\')" aria-label="Delete">'+TRASH_SVG+'</button>'+
    '</div>'
  ).join('');
}

function openNoteSheet(){
  openSheet(
    '<h3>New note</h3>'+
    '<div class="field"><label>Title</label><input id="ntTitle" placeholder="Holiday ideas"></div>'+
    '<div class="field"><label>Note</label><textarea id="ntBody" placeholder="Write anything…"></textarea></div>'+
    '<div class="field"><label>From</label>'+segControl('ntPerson', personOptions(), 0)+'</div>'+
    '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button>'+
    '<button class="btn" onclick="saveNote()">Save note</button></div>'
  );
}
function saveNote(){
  const title = document.getElementById('ntTitle').value.trim();
  const body = document.getElementById('ntBody').value.trim();
  if(!title && !body) return;
  S.notes.unshift({id:uid(), title, body, person:segVal('ntPerson'), ts:Date.now()});
  play('add'); save('notes'); closeSheet(); renderNotes();
}
function delNote(id){
  S.notes = S.notes.filter(n=>n.id!==id);
  play('del'); save('notes'); renderNotes();
}
function renderNotes(){
  const list = document.getElementById('noteList');
  if(!S.notes.length){
    list.innerHTML = '<div class="empty"><b>No notes yet</b>Shared lists, plans, reminders for each other.</div>';
    return;
  }
  list.innerHTML = S.notes.map(n=>
    '<div class="card note">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<strong>'+esc(n.title||'Note')+'</strong>'+
        '<button class="icon-btn" onclick="delNote(\''+n.id+'\')" aria-label="Delete">'+TRASH_SVG+'</button>'+
      '</div>'+
      (n.body?'<div class="body">'+esc(n.body)+'</div>':'')+
      '<div class="who">'+personTag(n.person)+' · '+new Date(n.ts).toLocaleDateString('en-AU',{day:'numeric',month:'short'})+'</div>'+
    '</div>'
  ).join('');
}

/* =================== chores =================== */
const FREQ = [[1,'Every day'],[2,'Every 2 days'],[3,'Every 3 days'],[7,'Weekly'],
              [14,'Fortnightly'],[30,'Monthly'],[60,'Every 2 months'],[90,'Every 3 months']];
const CHORE_IDEAS = [['Empty litter boxes',2],['Clean dishwasher filter',30],['Bins out',7],
  ['Vacuum',7],['Change sheets',14],['Clean bathroom',7],['Mop floors',14],['Water plants',3]];

function choreDaysLeft(c){
  if(!c.lastDone) return null;
  const due = new Date(c.lastDone+'T00:00');
  due.setDate(due.getDate() + c.everyDays);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((due - today)/86400000);
}
function choreStatus(c){
  const d = choreDaysLeft(c);
  if(d === null) return {cls:'due', txt:'Do it now', rank:-9999};
  if(d < 0)  return {cls:'due',  txt:(-d)+'d overdue', rank:d};
  if(d === 0) return {cls:'soon', txt:'Due today', rank:0};
  if(d <= 2) return {cls:'soon', txt:'In '+d+'d', rank:d};
  return {cls:'both', txt:'In '+d+'d', rank:d};
}
function choreTurn(c){
  if(c.person === 3) return {name:S.people[c.turn||0]||'', cls:(c.turn||0)?'t1':''};
  if(c.person === 2) return {name:'Either of you', cls:'tboth'};
  return {name:S.people[c.person]||'', cls:c.person?'t1':''};
}
function choresDueNow(){ return S.chores.filter(c=>choreStatus(c).rank <= 0); }

function doChore(id){
  const c = S.chores.find(x=>x.id===id); if(!c) return;
  c.lastDone = isoDate(new Date());
  c.lastBy = (c.person === 3) ? (c.turn||0) : (c.person === 2 ? ME : c.person);
  if(c.person === 3) c.turn = (c.turn||0) ? 0 : 1;   // hand over to the other one
  play('tick'); save('chores'); renderChores(); renderToday();
}
function delChore(id){
  S.chores = S.chores.filter(c=>c.id!==id);
  play('del'); save('chores'); closeSheet(); renderChores(); renderToday();
}

function openChoreSheet(editId, presetName, presetDays){
  const c = editId ? S.chores.find(x=>x.id===editId) : null;
  const days = c ? c.everyDays : (presetDays || 7);
  const opts = FREQ.map(f=>'<option value="'+f[0]+'"'+(f[0]===days?' selected':'')+'>'+f[1]+'</option>').join('');
  openSheet(
    '<h3>'+(c?'Edit chore':'Add a chore')+'</h3>'+
    (c||presetName ? '' :
      '<div class="chips">'+CHORE_IDEAS.map(i=>
        '<button class="chip" onclick="openChoreSheet(\'\',\''+i[0].replace(/'/g,"")+'\','+i[1]+')">'+esc(i[0])+'</button>'
      ).join('')+'</div>')+
    '<div class="field"><label>What needs doing?</label><input id="chName" placeholder="Clean dishwasher filter" value="'+
      esc(c ? c.name : (presetName||''))+'"></div>'+
    '<div class="field"><label>How often?</label><select id="chFreq">'+opts+
      '<option value="0"'+(c && !FREQ.some(f=>f[0]===days) ? ' selected':'')+'>Something else…</option></select></div>'+
    '<div class="field" id="chCustomWrap" style="display:none"><label>Every how many days?</label>'+
      '<input id="chCustom" type="number" inputmode="numeric" min="1" max="365" value="'+days+'"></div>'+
    '<div class="field"><label>Whose job?</label>'+
      segControl('chPerson', [S.people[0], S.people[1], 'Both', 'Take turns'], c ? c.person : 3)+'</div>'+
    '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button>'+
    '<button class="btn" onclick="saveChore(\''+(editId||'')+'\')">'+(c?'Save changes':'Add chore')+'</button></div>'+
    (c ? '<button class="danger-link" onclick="delChore(\''+editId+'\')">Delete this chore</button>' : '')
  );
  const sel = document.getElementById('chFreq');
  sel.addEventListener('change', ()=>{
    document.getElementById('chCustomWrap').style.display = sel.value === '0' ? 'block' : 'none';
  });
  if(sel.value === '0') document.getElementById('chCustomWrap').style.display = 'block';
  if(!presetName && !c) setTimeout(()=>document.getElementById('chName').focus(), 250);
}

function saveChore(editId){
  const name = document.getElementById('chName').value.trim();
  if(!name) return;
  let every = parseInt(document.getElementById('chFreq').value);
  if(!every) every = Math.max(1, Math.min(365, parseInt(document.getElementById('chCustom').value)||7));
  const person = segVal('chPerson');
  if(editId){
    Object.assign(S.chores.find(c=>c.id===editId), {name, everyDays:every, person});
  }else{
    S.chores.push({id:uid(), name, everyDays:every, person, lastDone:'', lastBy:null, turn:0});
  }
  play('add'); save('chores'); closeSheet(); renderChores(); renderToday();
}

function renderChores(){
  const due = choresDueNow().length;
  document.getElementById('choreCount').textContent =
    S.chores.length ? (due ? due+' need doing' : 'all up to date') : '';
  const list = document.getElementById('choreList');
  if(!S.chores.length){
    list.innerHTML = '<div class="empty"><b>No chores set up</b>Add the recurring stuff — litter boxes, dishwasher filter, bins — and it will keep track of when each one is next due.</div>';
    return;
  }
  const sorted = [...S.chores].sort((a,b)=>choreStatus(a).rank - choreStatus(b).rank);
  list.innerHTML = sorted.map(c=>{
    const st = choreStatus(c), turn = choreTurn(c);
    let last = 'Never done';
    if(c.lastDone){
      const ago = Math.round((new Date().setHours(0,0,0,0) - new Date(c.lastDone+'T00:00'))/86400000);
      last = (ago === 0 ? 'Done today' : ago === 1 ? 'Done yesterday' : 'Done '+ago+'d ago');
      if(c.lastBy !== null && S.people[c.lastBy]) last += ' by '+S.people[c.lastBy];
    }
    return '<div class="row">'+
      '<button class="check" onclick="doChore(\''+c.id+'\')" aria-label="Mark done"></button>'+
      '<div class="grow" onclick="openChoreSheet(\''+c.id+'\')">'+
        '<div class="title">'+esc(c.name)+'</div>'+
        '<div class="meta">'+last+' · '+freqLabel(c.everyDays)+'</div>'+
        '<div style="margin-top:4px"><span class="turn '+turn.cls+'">'+esc(turn.name)+'</span></div>'+
      '</div>'+
      '<span class="tag '+st.cls+'">'+st.txt+'</span>'+
    '</div>';
  }).join('');
}
function freqLabel(d){
  const f = FREQ.find(x=>x[0]===d);
  return f ? f[1].toLowerCase() : 'every '+d+' days';
}

/* =================== settings =================== */
function openSettings(){
  openSheet(
    '<h3>Who is who</h3>'+
    '<p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:12px">These label whose events, bills and notes are whose. '+
    '<span style="color:var(--p1);font-weight:600">●</span> is person 1, '+
    '<span style="color:var(--p2);font-weight:600">●</span> is person 2.</p>'+
    '<div class="name-row">'+avatar(0)+'<div class="field"><label>Person 1</label><input id="stP0" value="'+esc(S.people[0])+'"></div></div>'+
    '<div class="name-row">'+avatar(1)+'<div class="field"><label>Person 2</label><input id="stP1" value="'+esc(S.people[1])+'"></div></div>'+
    '<div class="field" style="margin-top:18px"><label>This phone belongs to</label>'+
      segControl('stMe', [S.people[0], S.people[1]], ME)+
      '<p style="font-size:12.5px;color:var(--ink-soft);margin-top:7px">Only used to say who made a change. Stays on this device.</p></div>'+
    '<div class="field"><label>Sound effects</label>'+
      segControl('stSnd', ['On','Off'], SOUND?0:1)+'</div>'+
    '<div class="field"><label>Appearance</label>'+
      segControl('stTheme', ['Auto','Light','Dark'], THEMES.indexOf(THEME))+
      '<p style="font-size:12.5px;color:var(--ink-soft);margin-top:7px">Auto follows your iPhone\'s Display setting.</p></div>'+
    '<div class="sheet-actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button>'+
    '<button class="btn" onclick="saveSettings()">Save</button></div>'+
    '<button class="danger-link" style="color:var(--p1)" onclick="lockNow()">Lock the app</button>'
  );
}
function saveSettings(){
  S.people[0] = document.getElementById('stP0').value.trim() || 'K';
  S.people[1] = document.getElementById('stP1').value.trim() || 'A';
  ME = segVal('stMe');
  SOUND = segVal('stSnd') === 0;
  THEME = THEMES[segVal('stTheme')] || 'auto';
  applyTheme();
  try{
    localStorage.setItem('homehub:me', String(ME));
    localStorage.setItem('homehub:sound', SOUND ? 'on' : 'off');
    localStorage.setItem('homehub:theme', THEME);
  }catch(e){}
  save('people'); closeSheet(); renderAll();
  play('tick');
}

/* =================== init =================== */
document.getElementById('grocInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addGrocery(); });
document.getElementById('taskInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTask(); });

function renderAll(){
  document.getElementById('avatarPair').innerHTML = avatar(0)+avatar(1);
  renderToday(); renderCal(); renderGrocery(); renderBills(); renderChores(); renderTasks(); renderNotes();
}
/* Register the service worker when self-hosted. Inside Claude's sandbox there
   is no sw.js and no permission to register one, so this quietly does nothing. */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

buildKeypad();
renderAll();

/* Splash → lock handoff */
(function bootSplash(){
  const splash = document.getElementById('splash');
  const lock = document.getElementById('lock');
  const av = document.getElementById('splashAvatars');
  if(av) av.innerHTML = avatar(0) + avatar(1);
  // Minimum dwell so the open animation reads; then fade into PIN
  const minMs = 1450;
  const start = performance.now();
  function dismiss(){
    const elapsed = performance.now() - start;
    const wait = Math.max(0, minMs - elapsed);
    setTimeout(()=>{
      splash.classList.add('done');
      lock.style.visibility = '';
      play('whoosh');
      setTimeout(()=> splash.remove(), 600);
    }, wait);
  }
  if(document.readyState === 'complete') dismiss();
  else window.addEventListener('load', dismiss);
})();

function startRealtime(){
  if(!CLOUD) return;
  sb.channel('homehub-'+HOUSEHOLD)
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'homehub_data', filter: 'household=eq.'+HOUSEHOLD },
      () => pollRemote())
    .subscribe((status, err) => {
      console.log('realtime status:', status, err || '');
      if(err) setSync('error', 'realtime: ' + status);
    });
}
function startSync(){
  if(!CLOUD) return;
  pollRemote();
  setInterval(pollRemote, 5000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollRemote(); });
  window.addEventListener('focus', pollRemote);
}
