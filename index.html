    --face:#c0c0c0;
    --face-light:#dfdfdf;
    --face-dark:#808080;
    --face-darker:#000000;
    --white:#ffffff;
    --titlebar-l:#000080;
    --titlebar-r:#1084d0;
    --titlebar-inactive-l:#808080;
    --titlebar-inactive-r:#b5b5b5;
    --desktop:#008080;
    --highlight:#0000af;
    --font: "Perfect DOS VGA 437","MS Sans Serif", Tahoma, Geneva, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;width:100%;height:100%;overflow:hidden;
    font-family: var(--font);
    -webkit-font-smoothing:none;
    user-select:none;
  }

  /* ---------- Win95 3D border helpers ---------- */
  .raised{
    border-top:2px solid var(--white);
    border-left:2px solid var(--white);
    border-right:2px solid var(--face-darker);
    border-bottom:2px solid var(--face-darker);
    box-shadow: inset 1px 1px 0 var(--face-light), inset -1px -1px 0 var(--face-dark);
  }
  .sunken{
    border-top:2px solid var(--face-dark);
    border-left:2px solid var(--face-dark);
    border-right:2px solid var(--white);
    border-bottom:2px solid var(--white);
    box-shadow: inset 1px 1px 0 var(--face-darker);
  }
  .btn95{
    background:var(--face);
    padding:4px 10px;
    cursor:pointer;
    font-size:12px;
    color:#000;
  }
  .btn95:active{
    border-top:2px solid var(--face-dark);
    border-left:2px solid var(--face-dark);
    border-right:2px solid var(--white);
    border-bottom:2px solid var(--white);
    box-shadow:none;
    padding:5px 9px 3px 11px;
  }

  ::-webkit-scrollbar{width:16px;height:16px;}
  ::-webkit-scrollbar-track{background:var(--face);}
  ::-webkit-scrollbar-thumb{background:var(--face); border-top:2px solid var(--white);border-left:2px solid var(--white);border-right:2px solid var(--face-darker);border-bottom:2px solid var(--face-darker);}
  ::-webkit-scrollbar-button{background:var(--face);height:16px;width:16px;}

  /* ================= POWER-ON SPLASH ================= */
  #power-on{
    position:fixed;inset:0;background:#000;z-index:10000;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:opacity .3s ease;
  }
  #power-on.hide{opacity:0;pointer-events:none;}
  #power-on-text{
    color:#0f0;font-family:"Courier New",monospace;font-size:18px;letter-spacing:2px;
  }
  #power-on-cursor{animation:pocblink 1s step-end infinite;}
  @keyframes pocblink{ 50%{ opacity:0; } }

  /* ================= BOOT SCREEN ================= */
  #boot{
    position:fixed;inset:0;background:#000;color:#fff;z-index:9999;
    font-family:"Courier New",monospace;
    display:flex;flex-direction:column;
    padding:18px 24px;font-size:14px;line-height:1.5;
    transition:opacity .5s ease;
  }
  #boot.hide{opacity:0;pointer-events:none;}
  #boot .bios-line{opacity:0;white-space:pre;}
  #boot .bios-line.show{opacity:1;}
  #boot-logo-screen{
    position:fixed;inset:0;background:#000;display:none;
    flex-direction:column;align-items:center;justify-content:center;color:#fff;
    z-index:9999;
  }
  #boot-logo-screen.show{display:flex;}
  .win95-logo{
    display:flex;align-items:center;gap:18px;
    font-family:Arial,sans-serif;
  }
  .flag95{
    width:60px;height:56px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;
    transform:skewY(-6deg);
  }
  .flag95 span{display:block;}
  .flag95 .r{background:#ff4d4d;}
  .flag95 .g{background:#4dff4d;}
  .flag95 .b{background:#4d4dff;}
  .flag95 .y{background:#ffd24d;}
  .win95-wordmark{font-size:34px;color:#fff;font-weight:400;}
  .win95-wordmark b{font-weight:700;}
  .win95-sub{font-size:12px;letter-spacing:2px;color:#ccc;margin-top:4px;font-family:"MS Sans Serif",Tahoma,sans-serif;}
  #boot-progress-wrap{margin-top:34px;width:220px;}
  #boot-progress{
    width:100%;height:14px;background:#000;border:2px solid #fff;padding:2px;
  }
  #boot-progress-bar{height:100%;width:0%;background:repeating-linear-gradient(90deg,#c0c0c0 0 6px,#000080 6px 8px);transition:width .25s linear;}

  /* ================= DESKTOP ================= */
  #desktop{
    position:fixed;inset:0;background:var(--desktop);
    background-image:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0, transparent 60%);
    display:none;
    overflow:hidden;
  }
  #desktop.show{display:block;}

  #icons{
    position:absolute;top:0;left:0;right:0;bottom:46px;
  }
  .desk-icon{
    position:absolute;
    width:78px;height:80px;
    display:flex;flex-direction:column;align-items:center;
    gap:4px;padding:4px;cursor:pointer;
  }
  .desk-icon canvas{image-rendering:pixelated;image-rendering:crisp-edges;width:40px;height:40px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.4));}
  .desk-icon span{
    color:#fff;font-size:11px;text-align:center;line-height:1.2;
    text-shadow:1px 1px 1px #000;padding:1px 3px;
  }
  .desk-icon.selected span{background:var(--highlight);}
  .desk-icon:focus{outline:none;}
  .desk-icon.selected canvas{opacity:.85;}
  .desk-icon.dragging{opacity:.65;z-index:50;}

  /* ================= WINDOWS ================= */
  .win95-window{
    position:absolute;
    background:var(--face);
    min-width:260px;
    display:flex;flex-direction:column;
    box-shadow:2px 2px 8px rgba(0,0,0,.5);
  }
  .win-titlebar{
    background:linear-gradient(90deg,var(--titlebar-l),var(--titlebar-r));
    color:#fff;font-weight:bold;font-size:13px;
    display:flex;align-items:center;gap:5px;
    padding:3px 3px 3px 5px;cursor:default;
  }
  .win95-window.inactive .win-titlebar{
    background:linear-gradient(90deg,var(--titlebar-inactive-l),var(--titlebar-inactive-r));
  }
  .win-titlebar canvas{image-rendering:pixelated;width:16px;height:16px;flex-shrink:0;}
  .win-title-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .win-controls{display:flex;gap:2px;}
  .win-ctrl-btn{

  }
  .win-body.no-pad{padding:0;}
  .win-resize{
    position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;
  }

  #taskbar{

    border-top:2px solid var(--white);

/* ---- OpenWeatherMap config ---- */
const OWM_API_KEY = "e9229b855a058df8c8bad24c054f3d0e";
const OWM_CITY = "Brisbane,AU";           
const OWM_UNITS = "metric";           

function owmIconName(code){
  if(code >= 200 && code < 600) return "rain";
  if(code >= 600 && code < 700) return "rain";
  if(code === 800) return "sun";
  if(code > 800) return "partlycloudy";
  return "partlycloudy";
}

async function fetchWeather(){
  const cur = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(OWM_CITY)}&units=${OWM_UNITS}&appid=${OWM_API_KEY}`).then(r=>r.json());
  const fc = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(OWM_CITY)}&units=${OWM_UNITS}&appid=${OWM_API_KEY}`).then(r=>r.json());

  const daily = {};
  (fc.list || []).forEach(item=>{
    const date = item.dt_txt.split(" ")[0];
    const hour = item.dt_txt.split(" ")[1];
    if(hour === "12:00:00") daily[date] = item;
  });
  const forecast = Object.values(daily).slice(0,3).map(item=>({
    day: new Date(item.dt*1000).toLocaleDateString(undefined,{weekday:'short'}),
    tempC: Math.round(item.main.temp),
    condition: owmIconName(item.weather[0].id)
  }));

  return {
    city: `${cur.name}, ${cur.sys.country}`,
    tempC: Math.round(cur.main.temp),
    condition: owmIconName(cur.weather[0].id),
    forecast
  };
}

const T = null; // transparent
function drawIcon(canvas, matrix, palette){
  const rows = matrix.length, cols = matrix[0].length;
  canvas.width = cols; canvas.height = rows;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0,0,cols,rows);
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      const c = matrix[y][x];
      if(c === '.') continue;
      ctx.fillStyle = palette[c];
      ctx.fillRect(x,y,1,1);
    }
  }
}

/* =========================================================================
   2. STARTUP CHIME — synthesized (not a sampled recording) via WebAudio,
      evokes the classic Win95 startup chord.
   ========================================================================= */
let chimeHasPlayed = false;
function playChime(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const fire = ()=>{
      const now = ctx.currentTime;
      const notes = [
        {f:261.63, t:0.00, d:1.6, g:0.10}, // C4
        {f:329.63, t:0.05, d:1.5, g:0.09}, // E4
        {f:392.00, t:0.10, d:1.4, g:0.09}, // G4
        {f:523.25, t:0.15, d:1.3, g:0.11}, // C5
        {f:659.25, t:0.22, d:1.1, g:0.08}, // E5
      ];
      notes.forEach(n=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = n.f;
        gain.gain.setValueAtTime(0, now+n.t);
        gain.gain.linearRampToValueAtTime(n.g, now+n.t+0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, now+n.t+n.d);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now+n.t);
        osc.stop(now+n.t+n.d+0.1);
      });
      chimeHasPlayed = true;
    };
    // Browsers suspend new AudioContexts until a user gesture has occurred.
    // Try to resume + fire immediately; if that's blocked, armChimeFallback()
    // below will retry on the visitor's first click/tap/keypress.
    if(ctx.state === 'suspended'){
      ctx.resume().then(fire).catch(()=>{});
    } else {
      fire();
    }
  }catch(e){ /* audio unavailable, fail silently */ }
}
function armChimeFallback(){
  const tryPlay = ()=>{
    if(!chimeHasPlayed) playChime();
    document.removeEventListener('click', tryPlay);
    document.removeEventListener('keydown', tryPlay);
    document.removeEventListener('touchstart', tryPlay);
  };
  document.addEventListener('click', tryPlay);
  document.addEventListener('keydown', tryPlay);
  document.addEventListener('touchstart', tryPlay);
}
function playClick(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type='square'; osc.frequency.value=900;
    gain.gain.setValueAtTime(0.03, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.06);
    osc.connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+0.07);
  }catch(e){}
}

/* Wait for a click/keypress on the power-on splash before doing anything else.
   This click is the "user gesture" browsers require before audio can play,
   so the chime at the end of boot() fires reliably. */
function startPowerOn(){
  const splash = document.getElementById('power-on');
  const go = ()=>{
    splash.removeEventListener('click', go);
    document.removeEventListener('keydown', go);
    splash.classList.add('hide');
    // fire a silent oscillator immediately to fully unlock audio on this gesture
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state === 'suspended') ctx.resume();
    }catch(e){}
    setTimeout(runBoot, 250);
  };
  splash.addEventListener('click', go);
  document.addEventListener('keydown', go);
}
armChimeFallback();
startPowerOn();

/* =========================================================================
   4. WINDOW MANAGER
   ========================================================================= */
let zTop = 100;
let openWindows = {}; // id -> {el, taskBtn}

function bringToFront(id){
  zTop += 1;
  const w = openWindows[id];
  if(!w) return;
  w.el.style.zIndex = zTop;
  document.querySelectorAll('.win95-window').forEach(el=>el.classList.add('inactive'));
  w.el.classList.remove('inactive');
  document.querySelectorAll('.task-btn').forEach(b=>b.classList.remove('pressed'));
  w.taskBtn.classList.add('pressed');
}

function closeWindow(id){
  const w = openWindows[id];
  if(!w) return;
  w.el.remove();
  w.taskBtn.remove();
  delete openWindows[id];
}

function toggleMinimize(id){
  const w = openWindows[id];
  if(!w) return;
  const isHidden = w.el.style.display === 'none';
  if(isHidden){
    w.el.style.display='flex';
    bringToFront(id);
  } else {
    w.el.style.display='none';
  }
}

function makeDraggable(win, handle){
  let dragging=false, sx=0, sy=0, ox=0, oy=0;
  handle.addEventListener('mousedown', e=>{
    if(e.target.closest('.win-ctrl-btn')) return;
    dragging=true; sx=e.clientX; sy=e.clientY;
    const r = win.getBoundingClientRect();
    ox=r.left; oy=r.top;
    win.style.right='auto';
    document.body.style.userSelect='none';
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const nx = ox + (e.clientX - sx);
    const ny = Math.max(0, oy + (e.clientY - sy));
    win.style.left = nx+'px';
    win.style.top = ny+'px';
  });
  window.addEventListener('mouseup', ()=>{ dragging=false; document.body.style.userSelect=''; });
}

function openWindow({id, title, icon, width=420, height=320, x, y, bodyBuilder, noPad=false}){
  if(openWindows[id]){
    // already open: restore + focus
    openWindows[id].el.style.display='flex';
    bringToFront(id);
    return openWindows[id].el;
  }
  const layer = document.getElementById('window-layer');
  const win = document.createElement('div');
  win.className = 'win95-window raised';
  const deskRect = document.getElementById('desktop').getBoundingClientRect();
  const px = x !== undefined ? x : 60 + (Object.keys(openWindows).length*24) % 200;
  const py = y !== undefined ? y : 40 + (Object.keys(openWindows).length*24) % 160;
  win.style.left = px+'px';
  win.style.top = py+'px';
  win.style.width = width+'px';
  win.style.height = height+'px';
  win.style.zIndex = ++zTop;

  win.innerHTML = `
    <div class="win-titlebar"></div>
    <div class="win-body ${noPad?'no-pad':''}"></div>
    <div class="win-resize"></div>
  `;
  const titlebar = win.querySelector('.win-titlebar');
  titlebar.appendChild(iconCanvas(icon));
  const titleText = document.createElement('div');
  titleText.className='win-title-text';
  titleText.textContent = title;
  titlebar.appendChild(titleText);
  const controls = document.createElement('div');
  controls.className='win-controls';
  controls.innerHTML = `
    <div class="win-ctrl-btn raised" data-act="min">_</div>
    <div class="win-ctrl-btn raised" data-act="max">\u25A1</div>
    <div class="win-ctrl-btn raised" data-act="close">\u2715</div>
  `;
  titlebar.appendChild(controls);

  const body = win.querySelector('.win-body');
  bodyBuilder(body, ()=>closeWindow(id));

  layer.appendChild(win);
  makeDraggable(win, titlebar);

  controls.querySelector('[data-act=close]').addEventListener('click', ()=>{ playClick(); closeWindow(id); });
  controls.querySelector('[data-act=min]').addEventListener('click', ()=>{ playClick(); toggleMinimize(id); });
  controls.querySelector('[data-act=max]').addEventListener('click', ()=>{
    playClick();
    if(win.dataset.max === '1'){
      win.style.width = win.dataset.pw; win.style.height = win.dataset.ph;
      win.style.left = win.dataset.px; win.style.top = win.dataset.py;
      win.dataset.max = '0';
    } else {
      win.dataset.pw = win.style.width; win.dataset.ph = win.style.height;
      win.dataset.px = win.style.left; win.dataset.py = win.style.top;
      win.style.left='0'; win.style.top='0';
      win.style.width='100%'; win.style.height = 'calc(100% - 38px)';
      win.dataset.max = '1';
    }
  });

  win.addEventListener('mousedown', ()=>bringToFront(id));

  // resize
  let resizing=false, rsx=0, rsy=0, rw=0, rh=0;
  const resizer = win.querySelector('.win-resize');
  resizer.addEventListener('mousedown', e=>{
    resizing=true; rsx=e.clientX; rsy=e.clientY;
    rw=win.offsetWidth; rh=win.offsetHeight;
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!resizing) return;
    win.style.width = Math.max(240, rw + (e.clientX-rsx))+'px';
    win.style.height = Math.max(160, rh + (e.clientY-rsy))+'px';
  });
  window.addEventListener('mouseup', ()=>resizing=false);

  // taskbar button
  const tbtn = document.createElement('div');
  tbtn.className = 'task-btn raised';
  tbtn.appendChild(iconCanvas(icon));
  const tspan = document.createElement('span');
  tspan.textContent = title;
  tbtn.appendChild(tspan);
  tbtn.addEventListener('click', ()=>{
    playClick();
    if(win.style.display==='none'){ win.style.display='flex'; bringToFront(id); }
    else if(win.classList.contains('inactive') || win.style.zIndex != zTop) bringToFront(id);
    else toggleMinimize(id);
  });
  document.getElementById('taskbar-buttons').appendChild(tbtn);

  openWindows[id] = {el:win, taskBtn:tbtn};
  bringToFront(id);
  return win;
}

function tickClock(){

  h = h%12; if(h===0) h=12;
  el.textContent = `${h}:${String(m).padStart(2,'0')} ${ampm}`;
}

    cell.addEventListener('dblclick', ()=>openProjectDetail(p, idx));
    cell.addEventListener('click', ()=>{
      grid.querySelectorAll('.proj-icon-cell').forEach(c=>c.style.background='');
    });
    grid.appendChild(cell);
  });
  body.appendChild(grid);
  const hint = document.createElement('div');
  hint.style.marginTop='12px';
  hint.style.color='#444';
  hint.style.fontSize='11px';
  hint.textContent = 'Double-click a project to open it.';
  body.appendChild(hint);
}

function openProjectDetail(p, idx){
  openWindow({
    id:'project-'+idx,
    title:p.title,
    icon:p.icon,
    width:380, height:260,
    bodyBuilder:(body)=>{
      body.innerHTML = `
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <div class="proj-detail-icon" style="flex-shrink:0;"></div>
          <div>
            <div style="font-weight:bold;font-size:14px;">${p.title}</div>
            <div style="color:#000080;font-size:11px;margin-bottom:8px;">${p.tag}</div>
            <p style="margin:0 0 12px;">${p.desc}</p>
            <a class="btn95 raised" style="text-decoration:none;color:#000;display:inline-block;" href="${p.link}" target="_blank" rel="noopener">View Project \u2197</a>
          </div>
        </div>
      `;
      const ic = iconCanvas(p.icon);
      ic.style.width='48px'; ic.style.height='48px';
      body.querySelector('.proj-detail-icon').appendChild(ic);
    }
  });
}


function buildAlbumWindow(body){
  body.innerHTML = `<div class="album-panel"></div>`;
  const panel = body.querySelector('.album-panel');
  renderAlbumGate(panel);
}

function renderAlbumGate(panel){
  panel.innerHTML = `
    <div style="max-width:280px;">
      <p style="margin-top:0;">This album is private. Enter the password to view or add photos.</p>
      <input type="password" id="album-pass" placeholder="Password" />
      <div style="margin-top:10px;display:flex;gap:8px;">
        <div class="btn95 raised" id="album-unlock-btn">Unlock</div>
      </div>
      <div id="album-error" style="color:#a00;font-size:11px;margin-top:6px;"></div>
    </div>
  `;
  const input = panel.querySelector('#album-pass');
  const tryUnlock = ()=>{
    if(input.value === SITE.albumPassword){
      renderAlbumContent(panel);
    } else {
      panel.querySelector('#album-error').textContent = 'Incorrect password.';
    }
  };
  panel.querySelector('#album-unlock-btn').addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
}

async function loadAlbum(){
  try{
    const res = await window.storage.get('album', false);
    return res ? JSON.parse(res.value) : [];
  }catch(e){
    return [];
  }
}
async function saveAlbum(photos){
  try{
    await window.storage.set('album', JSON.stringify(photos), false);
  }catch(e){
    console.error('Could not save album', e);
  }
}

async function renderAlbumContent(panel){
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong>My Photos</strong>
      <label class="btn95 raised" style="cursor:pointer;">Upload<input type="file" id="album-upload" accept="image/*" multiple style="display:none;"></label>
    </div>
    <div id="album-status" style="font-size:11px;color:#444;"></div>
    <div class="album-grid" id="album-grid"></div>
  `;
  const grid = panel.querySelector('#album-grid');
  const status = panel.querySelector('#album-status');

  let photos = await loadAlbum();
  renderGrid();

  function renderGrid(){
    grid.innerHTML='';
    if(photos.length===0){
      grid.innerHTML = '<div style="grid-column:1/-1;color:#666;font-size:12px;">No photos yet \u2014 upload one above.</div>';
      return;
    }
    photos.forEach((p, i)=>{
      const cell = document.createElement('div');
      cell.className='album-thumb';
      cell.innerHTML = `<img src="${p.dataUrl}" alt="${p.caption||''}"><div class="del" title="Delete">\u2715</div>`;
      cell.querySelector('.del').addEventListener('click', async ()=>{
        photos.splice(i,1);
        await saveAlbum(photos);
        renderGrid();
      });
      grid.appendChild(cell);
    });
  }

  panel.querySelector('#album-upload').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length===0) return;
    status.textContent = 'Uploading...';
    for(const file of files){
      const dataUrl = await new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = ()=>resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      photos.push({dataUrl, caption:file.name, ts:Date.now()});
    }
    await saveAlbum(photos);
    status.textContent = '';
    renderGrid();
    e.target.value = '';
  });
}

/* =========================================================================
   7. DESKTOP + START MENU + TASKBAR SETUP
   ========================================================================= */
async function buildDesktop(){
  const icons = document.getElementById('icons');

  const deskItems = [
    { id:'mycomputer', icon:'computer', label:'My Computer', action:()=>openWindow({
        id:'mycomputer', title:'My Computer', icon:'computer', width:360, height:220,
        bodyBuilder:(body)=>{ body.innerHTML = `<p>Welcome \u2014 this machine hosts the portfolio of <strong>${SITE.name}</strong>.</p><p>Double-click the icons on the desktop to explore projects, or use the taskbar shortcuts below for the resume, profile, weather, and photo album.</p>`; }
      })
    },
    ...SITE.projects.map((p, idx)=>({
      id:'proj-desk-'+idx, icon:p.icon, label:p.title,
      action:()=>openProjectDetail(p, idx)
    })),
    { id:'recyclebin', icon:'bin', label:'Recycle Bin', action:()=>openWindow({
        id:'recyclebin', title:'Recycle Bin', icon:'bin', width:300, height:180,
        bodyBuilder:(body)=>{ body.innerHTML = `<p style="text-align:center;color:#666;">The Recycle Bin is empty.</p>`; }
      })
    },
  ];

  const GRID = 84; // px spacing between icon slots
  const iconsRect = icons.getBoundingClientRect();
  const rowsPerCol = Math.max(3, Math.floor(iconsRect.height / GRID));

  let savedPositions = {};
  try{
    const res = await window.storage.get('desktop-icon-positions', false);
    if(res) savedPositions = JSON.parse(res.value);
  }catch(e){ /* no saved positions yet */ }

  function savePositions(){
    window.storage.set('desktop-icon-positions', JSON.stringify(savedPositions), false).catch(()=>{});
  }

  deskItems.forEach((item, i)=>{
    const el = document.createElement('div');
    el.className = 'desk-icon';
    el.tabIndex = 0;
    el.appendChild(iconCanvas(item.icon));
    const span = document.createElement('span');
    span.textContent = item.label;
    el.appendChild(span);

    const col = Math.floor(i / rowsPerCol);
    const row = i % rowsPerCol;
    const defaultPos = { left: 12 + col*GRID, top: 12 + row*GRID };
    const pos = savedPositions[item.id] || defaultPos;
    el.style.left = pos.left+'px';
    el.style.top = pos.top+'px';

    // ---- drag handling ----
    let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
    el.addEventListener('mousedown', e=>{
      dragging = true; moved = false;
      sx = e.clientX; sy = e.clientY;
      ox = el.offsetLeft; oy = el.offsetTop;
      e.preventDefault();
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      if(!moved) return;
      el.classList.add('dragging');
      const bounds = icons.getBoundingClientRect();
      let nl = Math.max(0, Math.min(bounds.width - el.offsetWidth, ox + dx));
      let nt = Math.max(0, Math.min(bounds.height - el.offsetHeight, oy + dy));
      el.style.left = nl+'px';
      el.style.top = nt+'px';
    });
    window.addEventListener('mouseup', ()=>{
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(moved){
        savedPositions[item.id] = { left: el.offsetLeft, top: el.offsetTop };
        savePositions();
      } else {
        icons.querySelectorAll('.desk-icon').forEach(i2=>i2.classList.remove('selected'));
        el.classList.add('selected');
      }
    });
    el.addEventListener('dblclick', ()=>{ playClick(); item.action(); });
    icons.appendChild(el);
  });

  // click empty desktop deselects
  document.getElementById('desktop').addEventListener('click', (e)=>{
    if(e.target.id==='desktop'){
      icons.querySelectorAll('.desk-icon').forEach(i=>i.classList.remove('selected'));
    }
  });

  // ---- taskbar quicklaunch: Resume / Profile / Weather / Photos ----
  const quickItems = [
    { id:'resume', label:'Resume', icon:'document', build:buildResumeWindow, w:460, h:420 },
    { id:'profile', label:'Profile', icon:'profile', build:buildProfileWindow, w:420, h:280 },
    { id:'weather', label:'Weather', icon:'sun', build:buildWeatherWindow, w:360, h:280 },
    { id:'photos', label:'Photos', icon:'camera', build:buildAlbumWindow, w:420, h:360 },
  ];
  const ql = document.getElementById('quicklaunch');
  quickItems.forEach(q=>{
    const btn = document.createElement('div');
    btn.className='ql-btn raised';
    btn.title = q.label;
    btn.appendChild(iconCanvas(q.icon));
    btn.addEventListener('click', ()=>{
      playClick();
      openWindow({ id:q.id, title:q.label, icon:q.icon, width:q.w, height:q.h, bodyBuilder:q.build });
    });
    ql.appendChild(btn);
  });


  // ---- start icon ----
  renderIcon(document.getElementById('start-icon'), 'windowsflag');

  // ---- start menu ----
  const smItems = document.getElementById('start-menu-items');
  const menuEntries = [
    { icon:'folder', label:'My Projects', action:()=>openWindow({id:'projects', title:'My Projects', icon:'folder', width:420, height:320, bodyBuilder:buildProjectsWindow}) },
    { icon:'document', label:'Resume', action:()=>openWindow({ id:'resume', title:'Resume', icon:'document', width:460, height:420, bodyBuilder:buildResumeWindow}) },
    { icon:'profile', label:'Profile', action:()=>openWindow({ id:'profile', title:'Profile', icon:'profile', width:420, height:280, bodyBuilder:buildProfileWindow}) },
    { icon:'sun', label:'Weather', action:()=>openWindow({ id:'weather', title:'Weather', icon:'sun', width:360, height:280, bodyBuilder:buildWeatherWindow}) },
    { icon:'camera', label:'Photos', action:()=>openWindow({ id:'photos', title:'Photos', icon:'camera', width:420, height:360, bodyBuilder:buildAlbumWindow}) },
    { sep:true },
    { icon:'computer', label:'My Computer', action:()=>document.getElementById('mycomputer') },
    { sep:true },
    { icon:'bin', label:'Shut Down...', action:()=>shutDown() },
  ];
  menuEntries.forEach(entry=>{
    if(entry.sep){
      const sep = document.createElement('div'); sep.className='sm-sep'; smItems.appendChild(sep); return;
    }
    const item = document.createElement('div');
    item.className='sm-item';
    item.appendChild(iconCanvas(entry.icon));
    const span = document.createElement('span'); span.textContent = entry.label;
    item.appendChild(span);
    item.addEventListener('click', ()=>{
      playClick();
      document.getElementById('start-menu').classList.remove('show');
      document.getElementById('start-btn').classList.remove('active');
      entry.action();
    });
    smItems.appendChild(item);
  });

  const startBtn = document.getElementById('start-btn');
  startBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    playClick();
    const menu = document.getElementById('start-menu');
    menu.classList.toggle('show');
    startBtn.classList.toggle('active');
  });
  document.addEventListener('click', ()=>{
    document.getElementById('start-menu').classList.remove('show');
    startBtn.classList.remove('active');
  });

  tickClock();

  setTimeout(()=>{
    openWindow({id:'projects', title:'My Projects', icon:'folder', width:440, height:340, x:70, y:40, bodyBuilder:buildProjectsWindow});
  }, 300);
}

function shutDown(){
  const desktop = document.getElementById('desktop');
  desktop.innerHTML = `<div style="position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'MS Sans Serif',Tahoma,sans-serif;font-size:16px;">It's now safe to close this tab.</div>`;
}
</script>
