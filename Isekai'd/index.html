<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07051a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Isekai'd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>I Got Isekai'd — The Video Game</title>
<style>
  html, body { margin: 0; height: 100%; background: #07051a; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; box-sizing: border-box;
         padding-top: env(safe-area-inset-top, 0px); -webkit-tap-highlight-color: transparent;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; box-shadow: 0 0 60px rgba(242,143,173,.15); outline: none; }
  #hint { position: fixed; bottom: 6px; right: 10px; color: #4a4670; font: 12px "Trebuchet MS", sans-serif; }
</style>
</head>
<body>
<canvas id="game" width="640" height="480" tabindex="0"></canvas>
<div id="hint">F = fullscreen</div>
<script src="data.js"></script>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script src="cloud.js"></script>
<script src="controls.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="maps.js"></script>
<script src="world.js"></script>
<script src="battle.js"></script>
<script src="story.js"></script>
<script src="quests.js"></script>
<script src="main.js"></script>
<script>
  // F toggles fullscreen on desktop (F11 also works as normal browser fullscreen)
  window.addEventListener('keydown', e => {
    if (e.code !== 'KeyF' || e.repeat) return;
    if (Scenes.top() instanceof NameEntryScene) return; // don't steal the letter F while typing a name
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener('fullscreenchange', () => setTimeout(() => { Controls.layout(); fitCanvas(); }, 50));
  // offline support once hosted (GitHub Pages etc). Skipped when opened straight from a file.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.focus();
</script>
</body>
</html>
